<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公司管理 - 美仓海外仓系统</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="styles.css?v=20260708-company-management" />
  </head>
  <body>
    <div class="layout company-layout">
      <nav class="sidebar company-sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark">MW</span>
          <span class="brand-name">美仓海外仓系统</span>
        </div>
        <div class="nav-menu">
          <button class="menu-button" type="button"><span class="menu-icon">▤</span><span>货件管理</span><span class="menu-caret">⌄</span></button>
          <button class="menu-button muted" type="button"><span class="menu-icon">☷</span><span>出运计划</span><span class="menu-caret">⌄</span></button>
          <button class="menu-button" type="button"><span class="menu-icon">⌂</span><span>入库管理</span><span class="menu-caret">⌄</span></button>
          <button class="menu-button" type="button"><span class="menu-icon">♙</span><span>库内管理</span><span class="menu-caret">⌄</span></button>
          <button class="menu-button" type="button"><span class="menu-icon">♙</span><span>出库管理</span><span class="menu-caret">⌄</span></button>
          <button class="menu-button" type="button"><span class="menu-icon">⌂</span><span>仓库管理</span><span class="menu-caret">⌄</span></button>
          <button class="menu-button" type="button"><span class="menu-icon">♙</span><span>数据报表</span><span class="menu-caret">⌄</span></button>
          <button class="menu-button" type="button"><span class="menu-icon">▧</span><span>单据管理</span><span class="menu-caret">⌄</span></button>
          <button class="menu-button" type="button"><span class="menu-icon">▣</span><span>财务管理</span><span class="menu-caret">⌄</span></button>
          <button class="menu-button active-parent" type="button" aria-expanded="true">
            <span class="menu-icon">⚙</span>
            <span>系统设置</span>
            <span class="menu-caret">⌃</span>
          </button>
          <div class="submenu open">
            <button class="submenu-button" type="button"><span class="submenu-icon">☰</span><span>菜单管理</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">♙</span><span>用户管理</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">♙</span><span>角色管理</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">☷</span><span>数据字典管理</span></button>
            <button class="tab-button active" data-tab="company" type="button"><span class="tab-icon">♙</span><span>公司管理</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">⌂</span><span>FBA仓库</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">▧</span><span>承运人</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">♙</span><span>船司代码</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">♙</span><span>派送城市</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">♙</span><span>代理商管理</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">♙</span><span>应付费用模板</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">♙</span><span>节假日管理</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">♙</span><span>问题件管理</span></button>
            <button class="submenu-button" type="button"><span class="submenu-icon">♙</span><span>拖车代理</span></button>
          </div>
        </div>
        <button class="sidebar-collapse" type="button" aria-label="收起侧栏">‹</button>
      </nav>

      <div class="company-workspace">
        <header class="company-topbar">
          <button class="topbar-icon" type="button" aria-label="菜单">☰</button>
          <button class="topbar-icon" type="button" aria-label="返回">‹</button>
          <nav class="open-tabs" aria-label="已打开页面">
            <button type="button">库区管理 <span>×</span></button>
            <button type="button">库位管理 <span>×</span></button>
            <button type="button">仓库管理 <span>×</span></button>
            <button type="button">常规库存 <span>×</span></button>
            <button type="button">暂存库存 <span>×</span></button>
            <button class="active" type="button">公司管理 <span>×</span></button>
          </nav>
          <div class="topbar-actions">
            <button class="plain-action" type="button">导出任务中心</button>
            <button class="plain-action" type="button">英文</button>
            <button class="pill-action" type="button">上海时区⌄</button>
            <button class="pill-action" type="button">⌖ 洛杉矶仓⌄</button>
            <span class="notify-dot">99</span>
            <span class="avatar">天</span>
            <span class="user-name">天健</span>
          </div>
        </header>

        <main class="page-shell company-page" id="tab-company">
          <section class="company-filter-panel" aria-label="公司筛选">
            <div class="company-filter-row">
              <label class="company-field">
                <span>公司代码</span>
                <input id="companyCodeFilter" type="text" placeholder="公司代码" autocomplete="off" />
              </label>
              <label class="company-field">
                <span>客户编码</span>
                <input id="companyCustomerCodeFilter" type="text" placeholder="客户编码" autocomplete="off" />
              </label>
              <label class="company-field">
                <span>公司名称</span>
                <input id="companyNameFilter" type="text" placeholder="公司名称" autocomplete="off" />
              </label>
              <label class="company-field">
                <span>公司类型</span>
                <select id="companyTypeFilter">
                  <option value="">公司类型</option>
                  <option value="客户">客户</option>
                  <option value="供应商">供应商</option>
                </select>
              </label>
              <label class="company-field">
                <span>状态</span>
                <select id="companyStatusFilter">
                  <option value="">状态</option>
                  <option value="启用">启用</option>
                  <option value="禁用">禁用</option>
                </select>
              </label>
            </div>
            <div class="company-filter-actions">
              <button id="companySearchButton" class="btn primary" type="button">搜索</button>
              <button id="companyResetButton" class="btn" type="button">重置</button>
              <button class="btn expand-btn" type="button"><span>⌄</span> 展开</button>
            </div>
          </section>

          <section class="company-table-panel" aria-label="公司管理列表">
            <div class="company-toolbar">
              <button class="btn primary" type="button">新增</button>
              <button class="btn primary" type="button">结算类型</button>
              <button class="btn primary" type="button">导出</button>
            </div>
            <div class="company-table-wrap">
              <table class="company-table">
                <thead>
                  <tr>
                    <th class="index-col">#</th>
                    <th class="check-col"><input id="companySelectAll" type="checkbox" aria-label="全选" /></th>
                    <th>公司代码</th>
                    <th>客户编码</th>
                    <th>公司名称</th>
                    <th>公司类型</th>
                    <th>币种</th>
                    <th>联系人</th>
                    <th>联系电话</th>
                    <th>业务员</th>
                    <th>公司状态</th>
                    <th>开户时间</th>
                    <th>首次预报下单时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="companyTableBody"></tbody>
              </table>
              <div id="companyEmptyState" class="empty-state" hidden>暂无匹配公司</div>
            </div>
            <div class="company-pagination">
              <span id="companyTotalText">共 0 条</span>
              <button class="page-arrow" type="button">‹</button>
              <button class="page-number active" type="button">1</button>
              <button class="page-number" type="button">2</button>
              <button class="page-number" type="button">3</button>
              <button class="page-number" type="button">4</button>
              <button class="page-number" type="button">5</button>
              <button class="page-arrow" type="button">›</button>
              <select aria-label="每页条数">
                <option>50 条/页</option>
                <option>100 条/页</option>
              </select>
              <span>跳至</span>
              <input type="text" aria-label="跳转页码" />
              <span>页</span>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="company-management.js?v=20260708-company-management"></script>
  </body>
</html>
